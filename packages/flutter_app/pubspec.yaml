name: paseo_sessions
description: Native Paseo Sessions client for desktop and mobile.
publish_to: "none"
version: 0.13.0+13000

environment:
  sdk: ^3.13.4

dependencies:
  app_badge_plus: ^1.3.5
  app_links: ^7.2.2
  characters: ^1.4.1
  collection: ^1.19.1
  crypto: ^3.0.8
  cryptography: ^2.9.0
  dbus: ^0.7.15
  desktop_drop: ^0.8.4
  desktop_multi_window:
    path: ../flutter_desktop_host/third_party/desktop_multi_window
  ffi: ^2.2.0
  file_selector: ^1.1.0
  firebase_core: 4.15.1
  firebase_messaging: 16.7.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_svg: ^2.3.2
  highlight: ^0.7.0
  intl: ^0.20.3
  lucide_icons_flutter: ^3.1.24
  markdown: ^7.3.1
  mobile_scanner: ^7.4.2
  nativeapi: ^0.5.2
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  paseo_flutter_audio:
    path: ../flutter_audio
  paseo_desktop_integrations:
    path: ../flutter_desktop_host/integrations
  permission_handler: ^13.0.2
  pinenacl: ^0.6.0
  screen_retriever: ^0.2.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  tray_manager: ^0.8.0
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  window_manager: ^0.5.2
  xterm: ^4.0.0
  pasteboard: ^0.6.0
  yaml: ^3.1.3
  msgpack_stream: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/locales/
    - assets/keyboard.json
    - assets/desktop/
    - ../flutter_desktop_host/updater/replace.sh
