name: paseo_desktop_integrations
description: Native desktop integration for Paseo Sessions.
version: 1.0.0
publish_to: none
environment:
  sdk: ">=3.10.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      linux:
        pluginClass: PaseoDesktopIntegrationsPlugin
      macos:
        pluginClass: PaseoDesktopIntegrationsPlugin
      windows:
        pluginClass: PaseoDesktopIntegrationsPluginCApi
