name: paseo_flutter_audio
description: Native PCM16 and encoded audio playback for Paseo.
version: 1.0.0
publish_to: none
environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_soloud: ^5.2.2
flutter:
  plugin:
    platforms:
      android:
        package: app.paseo.flutter_audio
        pluginClass: PaseoFlutterAudioPlugin
      ios:
        pluginClass: PaseoFlutterAudioPlugin
