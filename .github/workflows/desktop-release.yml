name: Native Release

on:
  push:
    tags:
      - "v*"
      - "desktop-v*"
      - "desktop-macos-v*"
      - "desktop-linux-v*"
      - "desktop-windows-v*"
      - "android-v*"
      - "app-v*"
      - "!app-v*-beta.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source tag (vX.Y.Z or a platform release tag)
        required: true
        type: string
      mode:
        description: Build native artifacts or publish preserved artifacts from a prior run
        type: choice
        options: [build, publish-only]
        default: build
      recovery_run_id:
        description: Exact prior Native Release run ID; required for publish-only or publishing one macOS architecture
        type: string
        default: ""
      platform:
        description: Native platform or macOS architecture to build
        type: choice
        options: [all, desktop, macos, linux, windows, android, ios, macos-arm64, macos-x64]
        default: all
      checkout_ref:
        description: Optional source ref override (must have the same package version as tag)
        type: string
        default: ""
      publish:
        description: Publish artifacts to GitHub Releases
        type: choice
        options: ["true", "false"]
        default: "true"
      rollout_hours:
        description: Linear desktop rollout duration in hours; 0 admits everyone
        type: string
        default: "36"

permissions:
  contents: read
  packages: read

concurrency:
  group: native-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  SOURCE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.checkout_ref || github.event.inputs.tag) || github.ref_name }}
  SHOULD_PUBLISH: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish != 'false' }}
  RECOVERY_MODE: ${{ github.event.inputs.mode || 'build' }}
  RECOVERY_RUN_ID: ${{ github.event.inputs.recovery_run_id || '' }}
  ROLLOUT_HOURS: ${{ github.event.inputs.rollout_hours || '36' }}
  NODE_OPTIONS: --max-old-space-size=8192
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  ONNXRUNTIME_NODE_INSTALL: skip
  FLUTTER_VERSION: "3.47.5"

jobs:
  source:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      epoch: ${{ steps.source.outputs.epoch }}
      matrix: ${{ steps.plan.outputs.matrix }}
      expected: ${{ steps.plan.outputs.expected }}
      recovery: ${{ steps.plan.outputs.recovery }}
      release_tag: ${{ steps.plan.outputs.releaseTag }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      publish: ${{ steps.plan.outputs.publish }}
      create_release: ${{ steps.plan.outputs.createRelease }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - id: source
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          INPUT_PLATFORM: ${{ github.event.inputs.platform || 'all' }}
        shell: bash
        run: node scripts/flutter-release.mjs plan >> "$GITHUB_OUTPUT"
      - name: Validate recovery workflow and complete artifact inventory
        if: env.RECOVERY_RUN_ID != ''
        uses: actions/github-script@v7
        env:
          RECOVERY_TARGETS: ${{ steps.plan.outputs.recovery }}
        with:
          script: |
            const run_id = Number(process.env.RECOVERY_RUN_ID);
            if (String(run_id) === process.env.GITHUB_RUN_ID) throw new Error('Recovery requires a prior run.');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id});
            if (run.path !== '.github/workflows/desktop-release.yml' || run.status !== 'completed') {
              throw new Error('Recovery requires a completed canonical Native Release run.');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {...context.repo, run_id});
            for (const target of JSON.parse(process.env.RECOVERY_TARGETS)) {
              const matches = artifacts.filter(a => a.name === `native-release-${target}`);
              if (matches.length !== 1 || matches[0].expired) throw new Error(`Expected exactly one unexpired artifact for ${target}`);
            }

  native:
    needs: source
    if: github.event.inputs.mode != 'publish-only'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      SOURCE_DATE_EPOCH: ${{ needs.source.outputs.epoch }}
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
      PASEO_RELEASE_CHANNEL: ${{ needs.source.outputs.channel }}
      PASEO_NATIVE_RELEASE: "1"
      PASEO_UPDATE_REPOSITORY: ${{ github.repository }}
      PASEO_BUILD_SOURCE_SHA: ${{ needs.source.outputs.sha }}
      TARGET_ID: ${{ matrix.platform }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          architecture: ${{ matrix.arch == 'universal' && 'x64' || matrix.arch }}
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@boudra"
      - name: Install locked backend build dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@1.93.1
        if: matrix.desktop
      - uses: Swatinem/rust-cache@v2
        if: matrix.desktop
        with:
          shared-key: native-release-${{ matrix.platform }}-${{ matrix.arch }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.cache/paseo-flutter-packaging
          key: flutter-native-${{ runner.os }}-${{ matrix.arch }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('packages/flutter_app/pubspec.lock', 'packages/flutter_desktop_host/packaging/*-runtime.mjs', 'packages/flutter_desktop_host/packaging/appimage-tools.mjs') }}
      - name: Install Linux native build prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libayatana-appindicator3-dev libasound2-dev libpulse-dev libsm-dev dpkg-dev ffmpeg pulseaudio-utils xdg-utils patchelf
      - name: Provision pinned AppImage tools
        if: matrix.platform == 'linux'
        run: node packages/flutter_desktop_host/packaging/appimage-tools.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install nsis --version=3.11 --no-progress -y
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.platform == 'android'
      - name: Stage optional Android release signing key
        if: matrix.platform == 'android'
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE" ]]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/paseo-release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/paseo-release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build Flutter client and native Rust desktop runtime
        run: node scripts/build-flutter.mjs ${{ matrix.platform }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PASEO_BUILD_NUMBER: ${{ vars.PASEO_BUILD_NUMBER || '13000' }}
      # Without mobile signing credentials, artifacts are explicitly labelled
      # debug-signed APK / unsigned iOS .app, never presented as store submissions.
      - name: Package native desktop installers
        if: matrix.desktop
        run: node scripts/package-flutter-desktop.mjs ${{ matrix.platform }}
        env:
          CSC_LINK: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      - name: Package complete standalone native daemon
        if: matrix.desktop
        run: node scripts/package-native-daemon.mjs
        env:
          CSC_LINK: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      - name: Generate native update manifests
        if: matrix.desktop
        run: node scripts/generate-flutter-update-manifests.mjs
      - name: Record exact source, run and artifact hashes
        run: node scripts/flutter-release.mjs record
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-${{ matrix.platform }}-${{ matrix.arch }}
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
          path: |
            artifacts/flutter/Paseo-Sessions-Flutter-*
            artifacts/flutter/Paseo-Daemon-*
            artifacts/flutter/daemon-*.json
            artifacts/flutter/flutter-*.json
            artifacts/flutter/packages-*.json
            artifacts/flutter/provenance-*.json

  publish:
    needs: [source, native]
    if: ${{ !cancelled() && needs.source.result == 'success' && needs.source.outputs.publish == 'true' && (needs.native.result == 'success' || github.event.inputs.mode == 'publish-only') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    concurrency:
      group: desktop-rollout-${{ needs.source.outputs.release_tag }}
      cancel-in-progress: false
    env:
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
      RELEASE_TAG: ${{ needs.source.outputs.release_tag }}
      PASEO_RELEASE_CHANNEL: ${{ needs.source.outputs.channel }}
      EXPECTED_TARGETS: ${{ needs.source.outputs.expected }}
      RECOVERY_TARGETS: ${{ needs.source.outputs.recovery }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Download current build artifacts
        if: github.event.inputs.mode != 'publish-only'
        uses: actions/download-artifact@v4
        with:
          pattern: native-release-*
          merge-multiple: true
          path: artifacts/flutter
      - name: Download exact recovery artifacts
        if: env.RECOVERY_RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r target; do
            gh run download "$RECOVERY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "native-release-$target" --dir artifacts/flutter
          done < <(node -e 'for (const target of JSON.parse(process.env.RECOVERY_TARGETS)) console.log(target)')
      - name: Validate all source and artifact provenance before any release mutation
        run: node scripts/flutter-release.mjs validate
      - name: Regenerate native manifests at rollout start
        shell: bash
        run: |
          if compgen -G 'artifacts/flutter/packages-*.json' >/dev/null; then
            node scripts/generate-flutter-update-manifests.mjs
          fi
      - name: Publish native release assets and finalize complete desktop rollout
        env:
          GH_TOKEN: ${{ github.token }}
          CREATE_RELEASE: ${{ needs.source.outputs.create_release }}
          IS_PRERELEASE: ${{ needs.source.outputs.prerelease }}
        run: node scripts/publish-flutter-release.mjs
