name: CI Recovery
run-name: Recover ${{ inputs.job }} on ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      job:
        description: Failed check to run against the selected branch or tag
        required: true
        type: choice
        default: quality
        options:
          - quality
          - typecheck
          - server-tests-ubuntu
          - server-tests-windows
          - server-integration-windows
          - server-tests-macos
          - desktop-tests-ubuntu
          - desktop-tests-windows
          - app-tests
          - playwright-1
          - playwright-2
          - playwright-3
          - playwright-4
          - playwright-5
          - playwright-6
          - playwright-7
          - playwright-8
          - cli-tests-1
          - cli-tests-2
          - cli-tests-3

# Reuse the real checks without replacing their required status contexts.
# These report as "Recover / <check>", not as the normal push/PR check names.
jobs:
  recover:
    name: Recover
    # A reusable workflow cannot elevate the caller's token permissions.
    permissions:
      contents: read
      packages: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      recovery_job: ${{ inputs.job }}
    secrets: inherit
