name: CI Recovery
run-name: Recover ${{ inputs.job }} on ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      job:
        description: Failed check to run against the selected branch or tag
        required: true
        type: choice
        default: quality
        options:
          - quality
          - typecheck
          - native-daemon-linux
          - native-daemon-windows
          - native-daemon-macos
          - flutter-analyze
          - flutter-test
          - flutter-build-linux
          - flutter-build-windows
          - flutter-build-macos
          - flutter-build-android
          - flutter-build-ios

# Reuse the real checks without replacing their required status contexts.
# These report as "Recover / <check>", not as the normal push/PR check names.
jobs:
  recover:
    name: Recover
    # A reusable workflow cannot elevate the caller's token permissions.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      recovery_job: ${{ inputs.job }}
    secrets: inherit
