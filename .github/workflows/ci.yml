name: CI

on:
  push:
    branches: [main]
  # Every base branch, so stacked PRs and PRs into `next` get the same checks.
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:
    inputs:
      recovery_job:
        description: One check selected by CI Recovery; normal CI runs every routed check
        required: false
        type: string
        default: all

# A superseded run is cancelled only within the same recovery target.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.recovery_job || 'all' }}
  cancel-in-progress: true

env:
  # CI does not use the CUDA execution provider, and the onnxruntime-node
  # postinstall download from NuGet is large enough to make npm ci flaky.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ github.event_name != 'pull_request' || steps.filter.outputs.routing != 'false' || steps.filter.outputs.workspace != 'false' || steps.filter.outputs.ci != 'false' }}
      format: ${{ steps.filter.outputs.format }}
      quality: ${{ steps.filter.outputs.quality }}
      daemon: ${{ steps.filter.outputs.daemon }}
      flutter: ${{ steps.filter.outputs.flutter }}
      flutter_linux: ${{ steps.filter.outputs.flutter_linux }}
      flutter_windows: ${{ steps.filter.outputs.flutter_windows }}
      flutter_macos: ${{ steps.filter.outputs.flutter_macos }}
      flutter_android: ${{ steps.filter.outputs.flutter_android }}
      flutter_ios: ${{ steps.filter.outputs.flutter_ios }}
      sdk: ${{ steps.filter.outputs.sdk }}
      relay: ${{ steps.filter.outputs.relay }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate recovery target
        if: ${{ inputs.recovery_job && inputs.recovery_job != 'all' }}
        env:
          RECOVERY_JOB: ${{ inputs.recovery_job }}
        run: |
          case "$RECOVERY_JOB" in
            quality|typecheck|native-daemon-linux|native-daemon-windows|native-daemon-macos|flutter-analyze|flutter-test|flutter-build-linux|flutter-build-windows|flutter-build-macos|flutter-build-android|flutter-build-ios) ;;
            *) echo "::error::Unknown CI recovery target"; exit 2 ;;
          esac

      - name: Detect affected CI contracts
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: .github/ci-paths.yml

      - name: Validate CI contracts
        run: node --test scripts/ci-workflow.test.mjs scripts/flutter-release.test.mjs scripts/native-packaging.test.mjs scripts/release-version-utils.test.mjs scripts/publish-release-packages.test.mjs scripts/sync-fdroid-changelogs.test.mjs scripts/upload-release-assets.test.mjs

  quality:
    name: quality
    needs: changes
    if: ${{ !cancelled() && (!inputs.recovery_job || inputs.recovery_job == 'all' || inputs.recovery_job == 'quality') && (needs.changes.outputs.full != 'false' || needs.changes.outputs.format != 'false' || needs.changes.outputs.quality != 'false' || needs.changes.outputs.relay != 'false' || needs.changes.outputs.sdk != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        id: install
        run: node scripts/npm-retry.mjs ci

      # Explicit status checks keep independent domains running after a failure.
      # A failed step still fails quality; no continue-on-error or success shim.
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.format != 'false') }}
        run: npm run format:check

      - name: Lint lockfile
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
        run: npx --yes lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity

      - name: Verify dependency signatures
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
        run: npm audit signatures

      - name: Reject critical production vulnerabilities
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
        run: npm run lint

      - name: Test daemon launch and title synchronization
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
        run: node --test scripts/daemon-launch-contract.test.mjs

      - name: Build relay
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.relay != 'false') }}
        run: npm run build:relay

      - name: Run relay tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.relay != 'false') }}
        run: npm run test --workspace=@getpaseo/relay

      - name: Build client dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run build:relay && npm run build:client

      - name: Build plugin SDK
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run build:plugin

      - name: Run plugin SDK tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run test --workspace=@getpaseo/plugin

      - name: Run protocol tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run test --workspace=@getpaseo/protocol

      - name: Run client tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run test --workspace=@getpaseo/client

      - name: Run highlight tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run test --workspace=@getpaseo/highlight

      - name: Typecheck client examples
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run typecheck:examples --workspace=@getpaseo/client

  typecheck:
    name: typecheck
    needs: changes
    if: ${{ !cancelled() && (!inputs.recovery_job || inputs.recovery_job == 'all' || inputs.recovery_job == 'typecheck') && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build SDK dependencies
        run: npm run build:relay && npm run build:client && npm run build:plugin

      - name: Typecheck Node packages
        run: npm run typecheck:node

      - name: Run website tests
        run: npx vitest run packages/website/src --bail=1

      - name: Install website test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Verify website mockups
        run: npm run test:e2e --workspace=@getpaseo/website

      - name: Verify public package contents
        run: |
          npm pack --dry-run --ignore-scripts --workspace=@getpaseo/protocol
          npm pack --dry-run --ignore-scripts --workspace=@getpaseo/client

  native-daemon-linux:
    name: native-daemon-linux
    needs: changes
    if: ${{ !cancelled() && (!inputs.recovery_job || inputs.recovery_job == 'all' || inputs.recovery_job == 'native-daemon-linux') && (needs.changes.outputs.full != 'false' || needs.changes.outputs.daemon != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps: &native_daemon_steps
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-daemon-${{ runner.os }}-${{ runner.arch }}
      - name: Install optional plugin worker build dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Install Linux native runtime packaging prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Build native daemon and optional plugin worker
        run: node scripts/build-native-daemon.mjs
      - name: Test native backend contracts
        run: cargo test --workspace --locked
      - name: Run built-in plugin tests
        run: npm run test --workspace=@getpaseo/builtin-plugins

  native-daemon-windows:
    name: native-daemon-windows
    needs: changes
    if: ${{ !cancelled() && (!inputs.recovery_job || inputs.recovery_job == 'all' || inputs.recovery_job == 'native-daemon-windows') && (needs.changes.outputs.full != 'false' || needs.changes.outputs.daemon != 'false') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps: *native_daemon_steps

  native-daemon-macos:
    name: native-daemon-macos
    needs: changes
    if: ${{ !cancelled() && (!inputs.recovery_job || inputs.recovery_job == 'all' || inputs.recovery_job == 'native-daemon-macos') && (needs.changes.outputs.full != 'false' || needs.changes.outputs.daemon != 'false') }}
    runs-on: macos-14
    timeout-minutes: 45
    steps: *native_daemon_steps

  flutter-analyze:
    name: flutter-analyze
    needs: changes
    if: ${{ !cancelled() && (!inputs.recovery_job || inputs.recovery_job == 'all' || inputs.recovery_job == 'flutter-analyze') && (needs.changes.outputs.full != 'false' || needs.changes.outputs.flutter != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - &flutter_checkout
        uses: actions/checkout@v4
      - &flutter_sdk
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
          cache-key: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-3.47.5
      - &flutter_pub_cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~\AppData\Local\Pub\Cache
          key: flutter-pub-${{ runner.os }}-${{ runner.arch }}-3.47.5-${{ hashFiles('packages/flutter_app/pubspec.lock') }}
      - &flutter_pub_get
        name: Resolve locked Flutter packages
        working-directory: packages/flutter_app
        run: flutter pub get --enforce-lockfile
      - name: Analyze native Flutter sources
        working-directory: packages/flutter_app
        run: flutter analyze --no-pub

  flutter-test:
    name: flutter-test
    needs: changes
    if: ${{ !cancelled() && (!inputs.recovery_job || inputs.recovery_job == 'all' || inputs.recovery_job == 'flutter-test') && (needs.changes.outputs.full != 'false' || needs.changes.outputs.flutter != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - *flutter_checkout
      - *flutter_sdk
      - *flutter_pub_cache
      - *flutter_pub_get
      - name: Run Flutter unit and widget tests
        working-directory: packages/flutter_app
        run: flutter test --no-pub --coverage
      - name: Retain Flutter test coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-coverage
          path: packages/flutter_app/coverage/
          if-no-files-found: ignore
          retention-days: 7

  flutter-build-linux:
    name: flutter-build-linux
    needs: changes
    if: ${{ !cancelled() && (!inputs.recovery_job || inputs.recovery_job == 'all' || inputs.recovery_job == 'flutter-build-linux') && (needs.changes.outputs.full != 'false' || needs.changes.outputs.flutter != 'false' || needs.changes.outputs.flutter_linux != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - *flutter_checkout
      - *flutter_sdk
      - *flutter_pub_cache
      - name: Install Linux native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libayatana-appindicator3-dev libasound2-dev libpulse-dev libsm-dev ffmpeg pulseaudio-utils xdg-utils
      - *flutter_pub_get
      - name: Compile native Linux client and plugins
        working-directory: packages/flutter_app
        run: flutter build linux --release --no-pub
      - &flutter_build_diagnostics
        name: Retain native build diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-diagnostics
          path: |
            packages/flutter_app/build/**/CMakeConfigureLog.yaml
            packages/flutter_app/build/**/CMakeError.log
            packages/flutter_app/build/**/CMakeOutput.log
            packages/flutter_app/build/**/reports/
          if-no-files-found: ignore
          retention-days: 7

  flutter-build-windows:
    name: flutter-build-windows
    needs: changes
    if: ${{ !cancelled() && (!inputs.recovery_job || inputs.recovery_job == 'all' || inputs.recovery_job == 'flutter-build-windows') && (needs.changes.outputs.full != 'false' || needs.changes.outputs.flutter != 'false' || needs.changes.outputs.flutter_windows != 'false') }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - *flutter_checkout
      - *flutter_sdk
      - *flutter_pub_cache
      - *flutter_pub_get
      - name: Compile native Windows client and plugins
        working-directory: packages/flutter_app
        run: flutter build windows --release --no-pub
      - *flutter_build_diagnostics

  flutter-build-macos:
    name: flutter-build-macos
    needs: changes
    if: ${{ !cancelled() && (!inputs.recovery_job || inputs.recovery_job == 'all' || inputs.recovery_job == 'flutter-build-macos') && (needs.changes.outputs.full != 'false' || needs.changes.outputs.flutter != 'false' || needs.changes.outputs.flutter_macos != 'false') }}
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - *flutter_checkout
      - *flutter_sdk
      - *flutter_pub_cache
      - *flutter_pub_get
      - name: Compile native macOS client and plugins without signing
        working-directory: packages/flutter_app
        run: flutter build macos --release --no-pub --config-only && xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Release -derivedDataPath build/macos CODE_SIGNING_ALLOWED=NO build
      - *flutter_build_diagnostics

  flutter-build-android:
    name: flutter-build-android
    needs: changes
    if: ${{ !cancelled() && (!inputs.recovery_job || inputs.recovery_job == 'all' || inputs.recovery_job == 'flutter-build-android') && (needs.changes.outputs.full != 'false' || needs.changes.outputs.flutter != 'false' || needs.changes.outputs.flutter_android != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - *flutter_checkout
      - *flutter_sdk
      - *flutter_pub_cache
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - *flutter_pub_get
      - name: Compile native Android client and audio plugin
        working-directory: packages/flutter_app
        run: flutter build apk --debug --no-pub
      - *flutter_build_diagnostics

  flutter-build-ios:
    name: flutter-build-ios
    needs: changes
    if: ${{ !cancelled() && (!inputs.recovery_job || inputs.recovery_job == 'all' || inputs.recovery_job == 'flutter-build-ios') && (needs.changes.outputs.full != 'false' || needs.changes.outputs.flutter != 'false' || needs.changes.outputs.flutter_ios != 'false') }}
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - *flutter_checkout
      - *flutter_sdk
      - *flutter_pub_cache
      - *flutter_pub_get
      - name: Compile native iOS client and audio plugin without signing
        working-directory: packages/flutter_app
        run: flutter build ios --release --no-codesign --no-pub
      - *flutter_build_diagnostics
